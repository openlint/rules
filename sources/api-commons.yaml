# Naming rules from the API Commons common schema, measured from providers' own OpenAPI.
source: api-commons
name: API Commons Naming
url: https://github.com/api-commons/schema-commons
formats:
- OpenAPI 3.x
rules:
  commons-property-snake-case:
    description: Property names are snake_case. Single-word names (id, name, email) are the most common form of
      all (811 providers) and satisfy every convention. Among multi-word names the market is evenly split -- camelCase
      432 providers, snake_case 413 -- so the count cannot decide it. The commons uses snake_case because it has
      one spelling for an acronym (customer_id, never customerID or customerId) and the crosswalk carries camelCase
      names without loss. A decision, recorded as one.
    message: '{{property}} is not snake_case (the common vocabulary''s casing).'
    severity: info
    given: $..properties[*]~
    then:
      function: casing
      functionOptions:
        type: snake
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
  commons-path-segment-kebab-case:
    description: Literal path segments are lowercase, words separated by hyphens. Lowercase single words are used
      by 1209 providers; for multi-word segments kebab-case (731) leads snake_case (380) and camelCase (269).
    message: Path {{property}} has a segment that is not lowercase kebab-case.
    severity: warn
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: ^(/([a-z0-9]+(-[a-z0-9]+)*|\{[^}]+\}|v[0-9][a-z0-9.]*))*/?$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
  commons-collection-plural:
    description: A collection is named with a plural noun (/contacts, not /contact). 835 providers name collections
      in the plural, 414 use a singular somewhere.
    message: Collection path {{property}} ends in a singular segment.
    severity: info
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: /(contact|company|deal|lead|activity|task|note|pipeline|person|organization|account|opportunity)$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
  commons-path-param-snake-case:
    description: Path parameters are snake_case and name the thing they identify ({contact_id}). A bare {id} is
      the most common single form (723 providers) and passes; camelCase (579) leads snake_case (434) among multi-word
      names, so this is info, not a warning.
    message: Path {{property}} has a parameter that is not snake_case.
    severity: info
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: \{[^}]*[A-Z-][^}]*\}
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
  commons-query-param-snake-case:
    description: Query parameters are snake_case. Lowercase single words are used by 954 providers; snake_case (528)
      narrowly leads camelCase (562) among multi-word names.
    message: Query parameter {{value}} is not snake_case.
    severity: info
    given: $.paths[*][*].parameters[?(@.in == 'query')].name
    then:
      function: casing
      functionOptions:
        type: snake
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
  commons-timestamp-at-suffix:
    description: Timestamps end in _at (created_at, updated_at). 349 providers use the _at form, 130 a bare created/updated,
      89 a _date, _time or "on" suffix (createdon, add_time).
    message: '{{property}} looks like a timestamp; the common form is created_at / updated_at.'
    severity: warn
    given: $..properties
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: ^(created|updated|modified|deleted)(_?(date|time|on|On|Date|Time))?$|^(add|update|create|modify)_?[tT]ime$|^date_?(created|modified|updated)$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
  commons-pagination-limit-cursor:
    description: Page with limit and cursor. limit is the most common paging parameter (492 providers), ahead of
      page (394) and page_size (234); cursor (148) is the most common continuation token. Offset paging is fine;
      this flags the long tail of synonyms.
    message: '{{value}} is a paging synonym; the common pair is limit + cursor.'
    severity: info
    given: $.paths[*][*].parameters[?(@.in == 'query')].name
    then:
      function: pattern
      functionOptions:
        notMatch: ^(per_page|perPage|page_size|pageSize|top|\$top|skip|\$skip|max_results|maxResults|size|page_token|pageToken)$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
  commons-foreign-key-id-suffix:
    description: A reference to another resource is named <resource>_id (company_id, owner_id). camelCase ...Id
      is used by 381 providers and snake_case _id by 337; the commons follows commons-property-snake-case.
    message: '{{property}} is a reference; the common form is <resource>_id.'
    severity: info
    given: $..properties
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: '[a-z0-9](Id|ID)$'
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files, with duplicate
      listings and shared specifications folded: 1258 providers across the CRM, help desk, commerce, payments and
      card issuing contexts, read from OpenAPI the providers published themselves. They are re-measured and rendered
      into the ruleset each time a context is added. Opt-in, not recommended by default.


      Tested with Spectral 6.15.0: the five common OpenAPI documents are clean, and Pipedrive''s published v2 OpenAPI
      is flagged where its names differ from the common vocabulary (add_time and update_time, /activityFields).'
