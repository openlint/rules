# Naming rules from the API Commons common schema, measured from providers' own OpenAPI.
source: api-commons
name: API Commons Naming
url: https://github.com/api-commons/schema-commons
formats:
- OpenAPI 3.x
rules:
  commons-property-snake-case:
    description: Property names are snake_case. Single-word names (id, name, email) are the most common form of
      all and satisfy every convention. Among multi-word names the market is split -- snake_case 44 providers, camelCase
      41 in the CRM cohort -- so the commons picks one and the crosswalk carries the other. This is a choice, recorded
      as one.
    message: '{{property}} is not snake_case (the common vocabulary''s casing).'
    severity: info
    given: $..properties[*]~
    then:
      function: casing
      functionOptions:
        type: snake
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
  commons-path-segment-kebab-case:
    description: Literal path segments are lowercase, words separated by hyphens. Lowercase single words are used
      by 130 of 134 providers; for multi-word segments kebab-case (71) leads snake_case (41) and camelCase (41).
    message: Path {{property}} has a segment that is not lowercase kebab-case.
    severity: warn
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        match: ^(/([a-z0-9]+(-[a-z0-9]+)*|\{[^}]+\}|v[0-9][a-z0-9.]*))*/?$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
  commons-collection-plural:
    description: A collection is named with a plural noun (/contacts, not /contact). 83 providers name collections
      in the plural, 39 use a singular somewhere.
    message: Collection path {{property}} ends in a singular segment.
    severity: info
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: /(contact|company|deal|lead|activity|task|note|pipeline|person|organization|account|opportunity)$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
  commons-path-param-snake-case:
    description: Path parameters are snake_case and name the thing they identify ({contact_id}). A bare {id} is
      the most common single form (86 providers) and passes; camelCase (65) leads snake_case (50) among multi-word
      names, so this is info, not a warning.
    message: Path {{property}} has a parameter that is not snake_case.
    severity: info
    given: $.paths
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: \{[^}]*[A-Z-][^}]*\}
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
  commons-query-param-snake-case:
    description: Query parameters are snake_case. Lowercase single words are used by 109 providers; snake_case (69)
      narrowly leads camelCase (64) among multi-word names.
    message: Query parameter {{value}} is not snake_case.
    severity: info
    given: $.paths[*][*].parameters[?(@.in == 'query')].name
    then:
      function: casing
      functionOptions:
        type: snake
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
  commons-timestamp-at-suffix:
    description: Timestamps end in _at (created_at, updated_at). 37 providers use the _at form, 30 a bare created/updated,
      17 a _date, _time or "on" suffix (createdon, add_time).
    message: '{{property}} looks like a timestamp; the common form is created_at / updated_at.'
    severity: warn
    given: $..properties
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: ^(created|updated|modified|deleted)(_?(date|time|on|On|Date|Time))?$|^(add|update|create|modify)_?[tT]ime$|^date_?(created|modified|updated)$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
  commons-pagination-limit-cursor:
    description: Page with limit and cursor. limit is the most common paging parameter (51 providers), ahead of
      page (49) and page_size (38); cursor (25) is the most common continuation token. Offset paging is fine; this
      flags the long tail of synonyms.
    message: '{{value}} is a paging synonym; the common pair is limit + cursor.'
    severity: info
    given: $.paths[*][*].parameters[?(@.in == 'query')].name
    then:
      function: pattern
      functionOptions:
        notMatch: ^(per_page|perPage|page_size|pageSize|top|\$top|skip|\$skip|max_results|maxResults|size|page_token|pageToken)$
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
  commons-foreign-key-id-suffix:
    description: A reference to another resource is named <resource>_id (company_id, owner_id). camelCase ...Id
      is used by 42 providers and snake_case _id by 36; the commons keeps snake_case for consistency with commons-property-snake-case.
    message: '{{property}} is a reference; the common form is <resource>_id.'
    severity: info
    given: $..properties
    then:
      field: '@key'
      function: pattern
      functionOptions:
        notMatch: '[a-z0-9](Id|ID)$'
    recommended: false
    notes: 'Part of the API Commons naming ruleset, which the common schema in every API Commons bounded context
      is written to (https://github.com/api-commons/schema-commons). The counts are providers, not files: 134 providers
      tagged CRM in APIs.io, 1,155 OpenAPI documents the providers published themselves. Opt-in, not recommended
      by default.


      Tested with Spectral 6.15.0: the common CRM OpenAPI (api-commons/crm openapi.yml) is clean, and Pipedrive''s
      published v2 OpenAPI is flagged where its names differ from the common vocabulary (add_time and update_time,
      /activityFields).'
